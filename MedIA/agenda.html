<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Médica Inteligente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* =================================================================== */
        /* 1. ESTILOS GERAIS E TEMA (ROOT & BODY)                              */
        /* =================================================================== */
        :root {
            --bg-main: #f0f2f5;
            --bg-card: #ffffff;
            --text-primary: #333333;
            --text-secondary: #555555;
            --primary-color: #3a86ff;
            --primary-light: rgba(58, 134, 255, 0.2);
            --primary-dark: #005cbb;
            --border-color: #d1d9e6;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --transition-speed: 0.3s;
            --status-confirmado: #28a745;
            --status-pendente: #ffc107;
            --status-cancelado: #dc3545;
            --toast-success-bg: #28a745;
            --toast-error-bg: #dc3545;
        }

        body.dark-mode {
            --bg-main: #1e1e2f;
            --bg-card: #2a2a3a;
            --text-primary: #e0e0e0;
            --text-secondary: #9e9e9e;
            --primary-color: #7c4dff;
            --primary-light: rgba(124, 77, 255, 0.2);
            --primary-dark: #5e35b1;
            --border-color: #424242;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --status-confirmado: #3ddc62;
            --status-pendente: #ffce3a;
            --status-cancelado: #f85d6b;
            --toast-success-bg: #3ddc62;
            --toast-error-bg: #f85d6b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 20px 15px; transition: background-color var(--transition-speed), color var(--transition-speed); }
        body.modal-active { overflow: hidden; }
        
        /* =================================================================== */
        /* 2. LAYOUT PRINCIPAL E COMPONENTES                                   */
        /* =================================================================== */
        .main-container { max-width: 900px; width: 100%; }
        .homepage-card { background-color: var(--bg-card); border-radius: 20px; box-shadow: 0 15px 35px var(--shadow-color); padding: 35px; animation: slideUpFadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; width: 100%; position: relative; border: 1px solid var(--border-color); }
        .app-header { display: flex; justify-content: space-between; align-items: center; text-align: left; margin-bottom: 30px; padding-bottom: 30px; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; gap: 20px;}
        .app-header > div:first-child { flex-grow: 1; }
        .app-title { font-size: 2.2rem; font-weight: 700; }
        .app-subtitle { font-size: 1.1rem; color: var(--text-secondary); }
        
        /* ATUALIZAÇÃO: Container para os botões do cabeçalho */
        .header-actions { display: flex; align-items: center; gap: 15px; }

        /* ATUALIZAÇÃO: Botão de modo noturno agora é um item flexível */
        .dark-mode-toggle { position: relative; background: transparent; border: 1px solid var(--border-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all var(--transition-speed) ease; width: 44px; height: 44px; padding: 0; flex-shrink: 0; }
        .dark-mode-toggle:hover { border-color: var(--primary-color); transform: rotate(15deg) scale(1.1); }
        .icon-container { position: relative; width: 24px; height: 24px; overflow: hidden; }
        .moon-icon, .sun-icon { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55); }
        .sun-icon { opacity: 0; transform: translateY(100%); }
        body.dark-mode .sun-icon { opacity: 1; transform: translateY(0); }
        body.dark-mode .moon-icon { opacity: 0; transform: translateY(-100%); }
        @keyframes slideUpFadeIn { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        /* Estilos da Lista de Agenda */
        .lista-consultas { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 15px; }
        .item-consulta { display: flex; align-items: stretch; padding: 15px; background-color: var(--bg-main); border: 1px solid var(--border-color); border-radius: 12px; transition: all var(--transition-speed) ease; }
        .item-consulta-clickable { cursor: pointer; }
        .item-consulta-clickable:hover { transform: translateY(-5px); box-shadow: 0 8px 20px var(--shadow-color); border-color: var(--primary-color); }
        .consulta-hora { font-size: 1rem; font-weight: 600; color: var(--primary-color); width: 70px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .consulta-info { flex-grow: 1; margin: 0 15px; border-left: 2px solid var(--border-color); padding-left: 15px; }
        .consulta-paciente { font-size: 1.1rem; font-weight: 500; }
        .paciente-id { font-size: 0.85rem; color: var(--text-secondary); }
        .consulta-actions { display: flex; align-items: center; gap: 10px; }
        .consulta-status { padding: 5px 12px; border-radius: 15px; font-size: 0.8rem; font-weight: 600; color: white; align-self: center; }
        .status-confirmado { background-color: var(--status-confirmado); }
        .status-pendente { background-color: var(--status-pendente); }
        .status-cancelado { background-color: var(--status-cancelado); }
        .delete-btn { background: transparent; border: none; cursor: pointer; padding: 5px; color: var(--text-secondary); transition: all 0.2s ease; }
        .delete-btn:hover { color: var(--status-cancelado); transform: scale(1.2); }
        .delete-btn svg { width: 20px; height: 20px; }

        /* =================================================================== */
        /* 3. ESTILOS DE MODAIS E FORMULÁRIOS                                  */
        /* =================================================================== */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; animation: fadeIn 0.4s ease; padding: 20px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content { background-color: var(--bg-card); border-radius: 16px; box-shadow: 0 10px 40px var(--shadow-color); width: 100%; max-width: 800px; max-height: 90vh; display: flex; flex-direction: column; animation: slideUpFadeInModal 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
        @keyframes slideUpFadeInModal { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .modal-header { padding: 20px 30px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 1.5rem; font-weight: 600; color: var(--primary-color); }
        .modal-close-btn { font-size: 1.8rem; font-weight: bold; cursor: pointer; border: none; background: transparent; color: var(--text-secondary); transition: transform 0.2s ease, color 0.2s ease; }
        .modal-close-btn:hover { color: var(--text-primary); transform: scale(1.1); }
        
        .modal-body { padding: 30px; overflow-y: auto; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-section { margin-bottom: 30px; grid-column: 1 / -1; }
        .form-section-title { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .form-group { margin-bottom: 15px; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 8px; color: var(--text-secondary); font-size: 0.9rem; }
        .form-group input[type="text"], .form-group input[type="time"], .form-group textarea, .form-group select { width: 100%; padding: 10px 14px; background-color: var(--bg-main); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); font-size: 1rem; transition: all var(--transition-speed) ease; }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--primary-light); background-color: var(--bg-card); }
        
        .modal-footer { padding: 20px 30px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; background-color: var(--bg-main); border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; }
        .btn { padding: 12px 28px; font-size: 0.95rem; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; transition: all var(--transition-speed) ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn svg { width: 18px; height: 18px; }
        .btn-primary { background-image: linear-gradient(45deg, var(--primary-color), var(--primary-dark)); color: white; box-shadow: 0 4px 15px var(--primary-light); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--primary-light); }
        .btn-danger { background-color: var(--status-cancelado); color: white; }
        .btn-danger:hover { filter: brightness(1.1); }
        .btn-secondary { background-color: transparent; color: var(--text-secondary); border: 2px solid var(--border-color); }
        .btn-secondary:hover { background-color: var(--bg-main); border-color: var(--text-secondary); color: var(--text-primary); }

        /* Confirmação de Exclusão */
        #confirmDeleteModal .modal-content { max-width: 450px; max-height: auto; }
        #confirmDeleteModal .modal-body { text-align: center; font-size: 1.1rem; padding: 40px; }
        #confirmDeleteModal .modal-footer { justify-content: center; gap: 15px; }

        /* Toast Notifications */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 15px 20px; color: white; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); animation: slideInToast 0.5s forwards, fadeOutToast 0.5s 4.5s forwards; font-weight: 500; }
        .toast.success { background-color: var(--toast-success-bg); }
        .toast.error { background-color: var(--toast-error-bg); }
        @keyframes slideInToast { from { transform: translateX(120%); } to { transform: translateX(0); } }
        @keyframes fadeOutToast { from { opacity: 1; } to { opacity: 0; } }

    </style>
</head>
<body>

    <div class="main-container">
        <div class="homepage-card">
            
            <header class="app-header">
                <div>
                    <h1 class="app-title">Agenda Médica</h1>
                    <p class="app-subtitle" id="agenda-subtitle">Consultas de Hoje</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" id="addConsultaBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span>Nova Consulta</span>
                    </button>
                    <button class="dark-mode-toggle" id="darkModeToggle" aria-label="Alternar modo claro/escuro">
                        <div class="icon-container">
                            <div class="moon-icon">🌙</div>
                            <div class="sun-icon">☀️</div>
                        </div>
                    </button>
                </div>
            </header>
            
            <ul class="lista-consultas" id="listaConsultas">
                <!-- Consultas serão renderizadas aqui pelo JavaScript -->
            </ul>
        </div>
    </div>

    <!-- Modal para Adicionar/Editar Anamnese -->
    <div id="anamneseModal" class="modal-overlay">
        <div class="modal-content">
            <header class="modal-header">
                <div>
                    <h2 class="modal-title" id="modal-paciente-nome"></h2>
                    <p class="paciente-id" id="modal-paciente-id"></p>
                </div>
                <button class="modal-close-btn" id="closeAnamneseModal">&times;</button>
            </header>
            
            <main class="modal-body">
                <form id="anamneseForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="modal-hora">Horário</label>
                            <input type="time" id="modal-hora" name="hora" required>
                        </div>
                        <div class="form-group">
                            <label for="modal-status">Status</label>
                            <select id="modal-status" name="status">
                                <option value="confirmado">Confirmado</option>
                                <option value="pendente">Pendente</option>
                                <option value="cancelado">Cancelado</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-section">
                        <h3 class="form-section-title">Informações do Paciente</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="modal-paciente-nome-input">Nome do Paciente</label>
                                <input type="text" id="modal-paciente-nome-input" name="pacienteNome" required>
                            </div>
                            <div class="form-group">
                                <label for="modal-paciente-id-input">ID do Paciente</label>
                                <input type="text" id="modal-paciente-id-input" name="pacienteId">
                            </div>
                        </div>
                    </div>
                    <div class="form-section">
                        <h3 class="form-section-title">Queixa Principal (QP)</h3>
                        <div class="form-group full-width">
                            <textarea id="modal-queixa" name="queixaPrincipal" rows="2"></textarea>
                        </div>
                    </div>
                    <div class="form-section">
                        <h3 class="form-section-title">Histórico da Doença Atual (HDA)</h3>
                        <div class="form-group full-width">
                            <textarea id="modal-hda" name="hda" rows="4"></textarea>
                        </div>
                    </div>
                </form>
            </main>

            <footer class="modal-footer">
                <button type="submit" form="anamneseForm" class="btn btn-primary">Salvar Consulta</button>
            </footer>
        </div>
    </div>

    <!-- Modal de Confirmação para Excluir -->
    <div id="confirmDeleteModal" class="modal-overlay">
        <div class="modal-content">
             <header class="modal-header">
                <h2 class="modal-title">Confirmar Exclusão</h2>
            </header>
            <main class="modal-body">
                <p>Tem certeza de que deseja remover esta consulta? Esta ação não pode ser desfeita.</p>
            </main>
            <footer class="modal-footer">
                <button class="btn btn-secondary" id="cancelDeleteBtn">Cancelar</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">Sim, Excluir</button>
            </footer>
        </div>
    </div>

    <!-- Container para Notificações Toast -->
    <div id="toast-container"></div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- SELETORES DE ELEMENTOS DOM ---
        const body = document.body;
        const darkModeToggle = document.getElementById('darkModeToggle');
        const listaConsultasEl = document.getElementById('listaConsultas');
        const addConsultaBtn = document.getElementById('addConsultaBtn');
        const anamneseModal = document.getElementById('anamneseModal');
        const closeAnamneseModalBtn = document.getElementById('closeAnamneseModal');
        const anamneseForm = document.getElementById('anamneseForm');
        const confirmDeleteModal = document.getElementById('confirmDeleteModal');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const toastContainer = document.getElementById('toast-container');
        const subtitleEl = document.getElementById('agenda-subtitle');

        const STORAGE_KEY = 'consultasMedicas_v1';
        let consultas = [];
        let currentEditingIndex = null;
        let deleteIndex = null;

        // --- DADOS PADRÃO ---
        const DEFAULT_CONSULTAS = [
            { id: 1, hora: '09:00', pacienteNome: 'Ana Silva', pacienteId: '94210', queixaPrincipal: 'Dores de cabeça frequentes.', hda: 'Paciente refere início das dores há cerca de 2 meses...', status: 'confirmado' },
            { id: 2, hora: '10:00', pacienteNome: 'Carlos Pereira', pacienteId: '73458', queixaPrincipal: 'Retorno para avaliação de exames.', hda: 'Paciente apresentou melhora nos níveis de colesterol...', status: 'pendente' },
            { id: 3, hora: '11:00', pacienteNome: 'Mariana Costa', pacienteId: '88123', queixaPrincipal: '', hda: '', status: 'cancelado' }
        ];

        // --- LÓGICA PRINCIPAL ---
        const init = () => {
            setupEventListeners();
            loadConsultas();
            renderConsultas();
            updateSubtitle();
        };

        const loadConsultas = () => {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data && JSON.parse(data).length > 0) {
                consultas = JSON.parse(data);
            } else {
                consultas = DEFAULT_CONSULTAS;
                saveConsultas();
            }
        };

        const saveConsultas = () => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(consultas));
        };
        
        const updateSubtitle = () => {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            subtitleEl.textContent = `Consultas de Hoje - ${today.toLocaleDateString('pt-BR', options)}`;
        };

        // --- FUNÇÕES DE RENDERIZAÇÃO ---
        const renderConsultas = () => {
            listaConsultasEl.innerHTML = '';
            if (consultas.length === 0) {
                listaConsultasEl.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 20px 0;">Nenhuma consulta para hoje.</p>';
                return;
            }
            
            consultas.sort((a, b) => a.hora.localeCompare(b.hora));

            consultas.forEach((consulta, index) => {
                const li = document.createElement('li');
                li.className = 'item-consulta';
                if (consulta.status !== 'cancelado') {
                    li.classList.add('item-consulta-clickable');
                    li.dataset.index = index;
                } else {
                    li.style.cursor = 'not-allowed';
                    li.style.filter = 'grayscale(0.8)';
                    li.style.opacity = '0.7';
                }

                li.innerHTML = `
                    <div class="consulta-hora">${consulta.hora}</div>
                    <div class="consulta-info">
                        <div class="consulta-paciente">${consulta.pacienteNome}</div>
                        <div class="paciente-id">ID: ${consulta.pacienteId}</div>
                    </div>
                    <div class="consulta-actions">
                        <div class="consulta-status status-${consulta.status}">${consulta.status.charAt(0).toUpperCase() + consulta.status.slice(1)}</div>
                        ${consulta.status !== 'cancelado' ? `
                        <button class="delete-btn" data-index="${index}" title="Remover consulta">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        </button>` : ''}
                    </div>
                `;
                listaConsultasEl.appendChild(li);
            });
        };

        const showToast = (message, type = 'success') => {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        };

        // --- FUNÇÕES DE MODAL ---
        const openModal = (consulta = null, index = null) => {
            currentEditingIndex = index;
            anamneseForm.reset();

            if (consulta) { // Modo Edição
                document.getElementById('modal-paciente-nome').textContent = consulta.pacienteNome;
                document.getElementById('modal-paciente-id').textContent = `ID: ${consulta.pacienteId}`;
                document.getElementById('modal-hora').value = consulta.hora;
                document.getElementById('modal-status').value = consulta.status;
                document.getElementById('modal-paciente-nome-input').value = consulta.pacienteNome;
                document.getElementById('modal-paciente-id-input').value = consulta.pacienteId;
                document.getElementById('modal-queixa').value = consulta.queixaPrincipal || '';
                document.getElementById('modal-hda').value = consulta.hda || '';
            } else { // Modo Adição
                document.getElementById('modal-paciente-nome').textContent = 'Nova Consulta';
                document.getElementById('modal-paciente-id').textContent = 'Preencha os dados abaixo';
            }

            anamneseModal.style.display = 'flex';
            body.classList.add('modal-active');
        };

        const closeModal = () => {
            anamneseModal.style.display = 'none';
            body.classList.remove('modal-active');
            currentEditingIndex = null;
        };

        // --- EVENT LISTENERS ---
        const setupEventListeners = () => {
            darkModeToggle.addEventListener('click', () => {
                body.classList.toggle('dark-mode');
                localStorage.setItem('darkMode', body.classList.contains('dark-mode') ? 'enabled' : 'disabled');
            });

            addConsultaBtn.addEventListener('click', () => openModal());
            closeAnamneseModalBtn.addEventListener('click', closeModal);
            anamneseModal.addEventListener('click', (e) => { if (e.target === anamneseModal) closeModal(); });

            listaConsultasEl.addEventListener('click', (e) => {
                const item = e.target.closest('.item-consulta-clickable');
                const deleteBtn = e.target.closest('.delete-btn');

                if (deleteBtn) {
                    e.stopPropagation(); // Impede que o clique no botão de lixeira abra o modal
                    deleteIndex = parseInt(deleteBtn.dataset.index, 10);
                    confirmDeleteModal.style.display = 'flex';
                } else if (item) {
                    const index = parseInt(item.dataset.index, 10);
                    openModal(consultas[index], index);
                }
            });

            anamneseForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const formData = new FormData(anamneseForm);
                const consultaData = {
                    hora: formData.get('hora'),
                    pacienteNome: formData.get('pacienteNome'),
                    pacienteId: formData.get('pacienteId'),
                    status: formData.get('status'),
                    queixaPrincipal: formData.get('queixaPrincipal'),
                    hda: formData.get('hda'),
                };

                if (currentEditingIndex !== null) {
                    consultas[currentEditingIndex] = { ...consultas[currentEditingIndex], ...consultaData };
                } else {
                    consultaData.id = Date.now();
                    consultas.push(consultaData);
                }
                
                saveConsultas();
                renderConsultas();
                closeModal();
                showToast('Consulta salva com sucesso!');
            });

            confirmDeleteBtn.addEventListener('click', () => {
                if (deleteIndex !== null) {
                    consultas.splice(deleteIndex, 1);
                    saveConsultas();
                    renderConsultas();
                    showToast('Consulta removida.', 'error');
                }
                confirmDeleteModal.style.display = 'none';
                deleteIndex = null;
            });

            cancelDeleteBtn.addEventListener('click', () => {
                confirmDeleteModal.style.display = 'none';
                deleteIndex = null;
            });
        };

        // --- INICIALIZAÇÃO ---
        if (localStorage.getItem('darkMode') === 'enabled') {
            body.classList.add('dark-mode');
        }
        init();
    });
    </script>
</body>
</html>
