<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Paciente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* =================================================================== */
        /* CSS IDÊNTICO AO FICHEIRO ANTERIOR - TOTALMENTE REUTILIZADO         */
        /* =================================================================== */

        :root {
            --bg-main: #f0f2f5;
            --bg-card: #ffffff;
            --text-primary: #333333;
            --text-secondary: #555555;
            --primary-color: #3a86ff;
            --primary-light: rgba(58, 134, 255, 0.2);
            --primary-dark: #005cbb;
            --accent-color: #2ecc71;
            --accent-light: rgba(46, 204, 113, 0.1);
            --danger-color: #e74c3c;
            --danger-light: rgba(231, 76, 60, 0.1);
            --border-color: #d1d9e6;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --transition-speed: 0.3s;
        }

        body.dark-mode {
            --bg-main: #1e1e2f;
            --bg-card: #2a2a3a;
            --text-primary: #e0e0e0;
            --text-secondary: #9e9e9e;
            --primary-color: #7c4dff;
            --primary-light: rgba(124, 77, 255, 0.2);
            --primary-dark: #5e35b1;
            --accent-color: #00e676;
            --accent-light: rgba(0, 230, 118, 0.1);
            --danger-color: #ff5252;
            --danger-light: rgba(255, 82, 82, 0.1);
            --border-color: #424242;
            --shadow-color: rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
            transition: background-color var(--transition-speed), color var(--transition-speed);
            user-select: none;
        }
        
        .main-container { max-width: 850px; width: 100%; }

        .homepage-card {
            background-color: var(--bg-card);
            border-radius: 20px;
            box-shadow: 0 15px 35px var(--shadow-color);
            padding: 35px;
            animation: slideUpFadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            width: 100%;
            position: relative;
            border: 1px solid var(--border-color);
            transition: background-color var(--transition-speed), box-shadow var(--transition-speed), border-color var(--transition-speed);
        }
        
        /* Botão de Dark Mode (Idêntico) */
        .dark-mode-toggle {
            position: absolute; top: 25px; right: 25px;
            background: transparent; border: 1px solid var(--border-color);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all var(--transition-speed) ease;
            width: 44px; height: 44px; z-index: 100; padding: 0;
        }
        .dark-mode-toggle:hover {
            border-color: var(--primary-color);
            transform: rotate(15deg) scale(1.1);
            background-color: var(--bg-main);
        }
        .icon-container { position: relative; width: 24px; height: 24px; }
        .moon-icon, .sun-icon {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; line-height: 1;
            transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .sun-icon { opacity: 0; transform: translateY(100%) rotate(90deg) scale(0.5); }
        .moon-icon { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
        body.dark-mode .sun-icon { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
        body.dark-mode .moon-icon { opacity: 0; transform: translateY(-100%) rotate(-90deg) scale(0.5); }

        /* NOVO E ÚNICO ESTILO ADICIONADO */
        .logout-btn {
            position: absolute; top: 35px; left: 35px;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
            transition: color var(--transition-speed);
        }
        .logout-btn:hover {
            color: var(--primary-color);
        }
        
        /* Estilos de Cabeçalho e Título (Idênticos) */
        .app-header {
            display: flex; flex-direction: column; align-items: center;
            margin-bottom: 40px; padding-bottom: 30px;
            border-bottom: 1px solid var(--border-color); transition: border-color var(--transition-speed);
            text-align: center;
        }
        .app-title {
            font-size: 2.2rem; font-weight: 700; color: var(--text-primary);
            transition: color var(--transition-speed);
            letter-spacing: -1px;
            margin-bottom: 5px;
        }
        .app-subtitle {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-secondary);
        }
        
        /* Grelha e Cards de Módulos (Idênticos) */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
        }
        
        .module-card {
            all: unset;
            box-sizing: border-box;
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 25px; text-align: center; cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            will-change: transform, box-shadow;
            display: block;
            width: 100%;
            text-decoration: none; /* Adicionado para links */
        }
        .module-card:hover, .module-card:focus-visible {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px var(--shadow-color);
            outline: none;
            border-color: var(--primary-color);
        }
        .module-card:active {
            transform: translateY(-2px) scale(0.98);
            box-shadow: 0 4px 15px var(--shadow-color);
        }
        .module-card .section-icon {
            width: 36px; height: 36px; margin: 0 auto 15px auto;
            color: var(--primary-color); transition: transform 0.4s ease, color var(--transition-speed);
            display: block;
        }
        .module-card:hover .section-icon, .module-card:focus-visible .section-icon {
            transform: scale(1.2) rotate(-8deg);
        }
        .module-card-title {
            font-size: 1.1rem; font-weight: 600;
            color: var(--text-primary); transition: color var(--transition-speed);
        }
        
        /* Media Queries (Idênticas) */
        @media (max-width: 768px) {
            body { padding: 20px 10px; }
            .homepage-card { padding: 25px 20px; }
            .app-title { font-size: 2rem; }
            .app-subtitle { font-size: 1rem; }
            .modules-grid { grid-template-columns: repeat(2, 1fr); gap: 18px; }
            .module-card-title { font-size: 1rem; }
        }
        @media (max-width: 480px) {
            .app-title { font-size: 1.8rem; }
            .app-subtitle { font-size: 0.9rem; }
            .logout-btn { top: 25px; left: 20px; }
            .dark-mode-toggle { top: 15px; right: 15px; }
            .modules-grid { grid-template-columns: 1fr; gap: 15px; }
        }
    </style>
</head>
<body>

    <main class="main-container">
        <div class="homepage-card">
            
            <button class="dark-mode-toggle" id="darkModeToggle" aria-label="Alternar modo noturno">
                <div class="icon-container"><span class="moon-icon">🌙</span><span class="sun-icon">☀️</span></div>
            </button>
            <a href="#" class="logout-btn">Sair</a>
            
            <header class="app-header">
                <h1 class="app-title">Portal do Paciente</h1>
                <p class="app-subtitle">Bem-vindo(a) de volta, Carlos!</p>
            </header>

            <div class="modules-grid">
                
                <a href="#" class="module-card" style="animation-delay: 0.1s;">
                    <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <p class="module-card-title">Meus Agendamentos</p>
                </a>
                
                <a href="#" class="module-card" style="animation-delay: 0.2s;">
                     <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <p class="module-card-title">Meus Documentos</p>
                </a>

                <a href="#" class="module-card" style="animation-delay: 0.3s;">
                    <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <p class="module-card-title">Mensagens</p>
                </a>

                <a href="#" class="module-card" style="animation-delay: 0.4s;">
                    <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8.5 8.5v7h7"></path><path d="M8.2 19A9 9 0 0 0 19.8 8.2"></path><path d="M12 2v2"></path><path d="m4.9 4.9 1.4 1.4"></path><path d="M2 12h2"></path><path d="m4.9 19.1 1.4-1.4"></path><path d="M12 20v2"></path><path d="m19.1 19.1-1.4-1.4"></path><path d="M22 12h-2"></path><path d="m19.1 4.9-1.4 1.4"></path>
                    </svg>
                    <p class="module-card-title">Meus Medicamentos</p>
                </a>
                
                <a href="#" class="module-card" style="animation-delay: 0.5s;">
                    <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                    <p class="module-card-title">Financeiro</p>
                </a>

                <a href="#" class="module-card" style="animation-delay: 0.6s;">
                    <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <p class="module-card-title">Meu Perfil</p>
                </a>
                
            </div>

        </div>
    </main>
    
    <script>
        // ===================================================================
        // JAVASCRIPT SIMPLIFICADO APENAS PARA O SELETOR DE TEMA
        // ===================================================================

        const CONFIG = {
            darkModeKey: 'userDarkModePreference_portalPaciente_v1',
        };

        const body = document.body;
        const darkModeToggle = document.getElementById('darkModeToggle');

        function applyTheme(isDark) {
            body.classList.toggle('dark-mode', isDark);
        }

        function loadAndSetTheme() {
            const savedTheme = localStorage.getItem(CONFIG.darkModeKey);
            if (savedTheme !== null) {
                applyTheme(savedTheme === 'true');
            } else {
                applyTheme(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            }
        }
        
        // Aplica o tema na inicialização da página
        loadAndSetTheme(); 

        // Adiciona o evento ao botão de troca de tema
        darkModeToggle.addEventListener('click', () => {
            const isDarkMode = body.classList.toggle('dark-mode');
            localStorage.setItem(CONFIG.darkModeKey, isDarkMode);
        });
        
    </script>
</body>
</html>
