<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Anamnese</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* =================================================================== */
        /* 1. ESTILOS GERAIS E TEMA (ROOT & BODY)                              */
        /* =================================================================== */
        :root {
            --bg-main: #f0f2f5;
            --bg-card: #ffffff;
            --text-primary: #333333;
            --text-secondary: #555555;
            --primary-color: #3a86ff;
            --primary-light: rgba(58, 134, 255, 0.2);
            --primary-dark: #005cbb;
            --border-color: #d1d9e6;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --transition-speed: 0.3s;
            --danger-color: #dc3545;
            --toast-success-bg: #28a745;
            --toast-error-bg: #dc3545;
        }

        body.dark-mode {
            --bg-main: #1e1e2f;
            --bg-card: #2a2a3a;
            --text-primary: #e0e0e0;
            --text-secondary: #9e9e9e;
            --primary-color: #7c4dff;
            --primary-light: rgba(124, 77, 255, 0.2);
            --primary-dark: #5e35b1;
            --border-color: #424242;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --danger-color: #f85d6b;
            --toast-success-bg: #3ddc62;
            --toast-error-bg: #f85d6b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 20px 15px; transition: background-color var(--transition-speed), color var(--transition-speed); }
        body.modal-active { overflow: hidden; }
        
        /* =================================================================== */
        /* 2. LAYOUT PRINCIPAL E COMPONENTES                                   */
        /* =================================================================== */
        .main-container { max-width: 900px; width: 100%; }
        .homepage-card { background-color: var(--bg-card); border-radius: 20px; box-shadow: 0 15px 35px var(--shadow-color); padding: 35px; animation: slideUpFadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; width: 100%; position: relative; border: 1px solid var(--border-color); }
        .app-header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 30px; padding-bottom: 30px; border-bottom: 1px solid var(--border-color); }
        .app-title { font-size: 2.2rem; font-weight: 700; }
        .app-subtitle { font-size: 1.1rem; color: var(--text-secondary); margin-top: 5px; }
        
        .actions-container { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 30px; align-items: center; }
        .search-container { flex-grow: 1; position: relative; }
        #searchInput { width: 100%; height: 50px; padding: 10px 20px 10px 50px; font-size: 1rem; border-radius: 12px; border: 1px solid var(--border-color); background-color: var(--bg-main); transition: all var(--transition-speed); }
        #searchInput:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--primary-light); background-color: var(--bg-card); }
        .search-icon { position: absolute; top: 50%; left: 18px; transform: translateY(-50%); color: var(--text-secondary); width: 20px; height: 20px; }
        
        .dark-mode-toggle { position: absolute; top: 25px; right: 25px; background: transparent; border: 1px solid var(--border-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all var(--transition-speed) ease; width: 44px; height: 44px; z-index: 100; padding: 0; }
        .dark-mode-toggle:hover { border-color: var(--primary-color); transform: rotate(15deg) scale(1.1); }
        .icon-container { position: relative; width: 24px; height: 24px; overflow: hidden; }
        .moon-icon, .sun-icon { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55); }
        .sun-icon { opacity: 0; transform: translateY(100%); }
        body.dark-mode .sun-icon { opacity: 1; transform: translateY(0); }
        body.dark-mode .moon-icon { opacity: 0; transform: translateY(-100%); }
        @keyframes slideUpFadeIn { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        /* Lista de Pacientes */
        .lista-pacientes { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 15px; }
        .item-paciente { display: flex; align-items: center; padding: 15px 20px; background-color: var(--bg-main); border: 1px solid var(--border-color); border-radius: 12px; transition: all var(--transition-speed) ease; cursor: pointer; }
        .item-paciente:hover { transform: translateY(-5px); box-shadow: 0 8px 20px var(--shadow-color); border-color: var(--primary-color); }
        .paciente-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-right: 15px; background-color: var(--primary-light); flex-shrink: 0; }
        .paciente-info { flex-grow: 1; }
        .paciente-nome { font-size: 1.1rem; font-weight: 600; }
        .paciente-detalhe { font-size: 0.85rem; color: var(--text-secondary); }
        .paciente-actions { display: flex; align-items: center; gap: 10px; }
        .delete-btn { background: transparent; border: none; cursor: pointer; padding: 5px; color: var(--text-secondary); }
        .delete-btn:hover { color: var(--danger-color); transform: scale(1.2); }
        .delete-btn svg { width: 20px; height: 20px; }

        /* =================================================================== */
        /* 3. ESTILOS DE MODAIS E FORMULÁRIOS                                  */
        /* =================================================================== */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; animation: fadeIn 0.4s ease; padding: 20px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content { background-color: var(--bg-card); border-radius: 16px; box-shadow: 0 10px 40px var(--shadow-color); width: 100%; max-width: 800px; max-height: 90vh; display: flex; flex-direction: column; animation: slideUpFadeInModal 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
        @keyframes slideUpFadeInModal { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .modal-header { padding: 20px 30px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 1.5rem; font-weight: 600; color: var(--primary-color); }
        .modal-close-btn { font-size: 1.8rem; font-weight: bold; cursor: pointer; border: none; background: transparent; color: var(--text-secondary); transition: transform 0.2s ease, color 0.2s ease; }
        .modal-close-btn:hover { color: var(--text-primary); transform: scale(1.1); }
        
        .modal-body { padding: 30px; overflow-y: auto; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-section { margin-bottom: 30px; grid-column: 1 / -1; }
        .form-section-title { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .form-group { margin-bottom: 15px; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 8px; color: var(--text-secondary); font-size: 0.9rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 14px; background-color: var(--bg-main); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); font-size: 1rem; transition: all var(--transition-speed) ease; }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--primary-light); background-color: var(--bg-card); }
        
        .modal-footer { padding: 20px 30px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; background-color: var(--bg-main); border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; }
        .btn { padding: 12px 28px; font-size: 0.95rem; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; transition: all var(--transition-speed) ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn svg { width: 18px; height: 18px; }
        .btn-primary { background-image: linear-gradient(45deg, var(--primary-color), var(--primary-dark)); color: white; box-shadow: 0 4px 15px var(--primary-light); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--primary-light); }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-danger:hover { filter: brightness(1.1); }
        .btn-secondary { background-color: transparent; color: var(--text-secondary); border: 2px solid var(--border-color); }
        .btn-secondary:hover { background-color: var(--bg-main); border-color: var(--text-secondary); color: var(--text-primary); }

        #confirmDeleteModal .modal-content { max-width: 450px; max-height: auto; }
        #confirmDeleteModal .modal-body { text-align: center; font-size: 1.1rem; padding: 40px; }
        #confirmDeleteModal .modal-footer { justify-content: center; gap: 15px; }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 15px 20px; color: white; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); animation: slideInToast 0.5s forwards, fadeOutToast 0.5s 4.5s forwards; font-weight: 500; }
        .toast.success { background-color: var(--toast-success-bg); }
        .toast.error { background-color: var(--toast-error-bg); }
        @keyframes slideInToast { from { transform: translateX(120%); } to { transform: translateX(0); } }
        @keyframes fadeOutToast { from { opacity: 1; } to { opacity: 0; } }

    </style>
</head>
<body>

    <div class="main-container">
        <div class="homepage-card">
            
            <button class="dark-mode-toggle" id="darkModeToggle" aria-label="Alternar modo claro/escuro">
                <div class="icon-container">
                    <div class="moon-icon">🌙</div>
                    <div class="sun-icon">☀️</div>
                </div>
            </button>

            <header class="app-header">
                <div>
                    <h1 class="app-title">Anamnese de Pacientes</h1>
                    <p class="app-subtitle" id="agenda-subtitle">Busque por um paciente ou inicie uma nova anamnese.</p>
                </div>
            </header>
            
            <div class="actions-container">
                <div class="search-container">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="search" id="searchInput" placeholder="Buscar por nome ou ID...">
                </div>
                <button class="btn btn-primary" id="addAnamneseBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span>Nova Anamnese</span>
                </button>
            </div>
            
            <ul class="lista-pacientes" id="listaPacientes">
                </ul>
        </div>
    </div>

    <div id="anamneseModal" class="modal-overlay">
        <div class="modal-content">
            <header class="modal-header">
                <div>
                    <h2 class="modal-title" id="modal-title"></h2>
                    <p class="paciente-id" id="modal-paciente-id"></p>
                </div>
                <button class="modal-close-btn" id="closeAnamneseModal">&times;</button>
            </header>
            
            <main class="modal-body">
                <form id="anamneseForm">
                    <div class="form-section">
                        <h3 class="form-section-title">Informações do Paciente</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="modal-paciente-nome-input">Nome do Paciente</label>
                                <input type="text" id="modal-paciente-nome-input" name="pacienteNome" required>
                            </div>
                            <div class="form-group">
                                <label for="modal-paciente-id-input">ID do Paciente</label>
                                <input type="text" id="modal-paciente-id-input" name="pacienteId" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-section">
                        <h3 class="form-section-title">Queixa Principal (QP)</h3>
                        <div class="form-group full-width">
                            <textarea id="modal-queixa" name="queixaPrincipal" rows="2"></textarea>
                        </div>
                    </div>
                    <div class="form-section">
                        <h3 class="form-section-title">Histórico da Doença Atual (HDA)</h3>
                        <div class="form-group full-width">
                            <textarea id="modal-hda" name="hda" rows="4"></textarea>
                        </div>
                    </div>
                </form>
            </main>

            <footer class="modal-footer">
                <button type="submit" form="anamneseForm" class="btn btn-primary">Salvar Anamnese</button>
            </footer>
        </div>
    </div>

    <div id="confirmDeleteModal" class="modal-overlay">
        <div class="modal-content">
             <header class="modal-header">
                <h2 class="modal-title">Confirmar Exclusão</h2>
            </header>
            <main class="modal-body">
                <p>Tem certeza de que deseja remover o registro deste paciente? Esta ação não pode ser desfeita.</p>
            </main>
            <footer class="modal-footer">
                <button class="btn btn-secondary" id="cancelDeleteBtn">Cancelar</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">Sim, Excluir</button>
            </footer>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- SELETORES DE ELEMENTOS DOM ---
        const body = document.body;
        const darkModeToggle = document.getElementById('darkModeToggle');
        const listaPacientesEl = document.getElementById('listaPacientes');
        const addAnamneseBtn = document.getElementById('addAnamneseBtn');
        const searchInput = document.getElementById('searchInput');
        const anamneseModal = document.getElementById('anamneseModal');
        const closeAnamneseModalBtn = document.getElementById('closeAnamneseModal');
        const anamneseForm = document.getElementById('anamneseForm');
        const confirmDeleteModal = document.getElementById('confirmDeleteModal');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const toastContainer = document.getElementById('toast-container');
        
        const STORAGE_KEY_PACIENTES = 'pacientesAnamnese_v1';
        const STORAGE_KEY_DARK_MODE = 'userDarkModePreference_gestaoMedica_v1'; // Chave unificada
        let pacientes = [];
        let currentEditingIndex = null;
        let deleteIndex = null;

        // --- DADOS PADRÃO ---
        const DEFAULT_PACIENTES = [
            { id: 94210, pacienteNome: 'Ana Silva', queixaPrincipal: 'Dores de cabeça frequentes.', hda: 'Paciente refere início das dores há cerca de 2 meses...', lastUpdated: '2025-07-06T14:00:00Z' },
            { id: 73458, pacienteNome: 'Carlos Pereira', queixaPrincipal: 'Retorno para avaliação de exames.', hda: 'Paciente apresentou melhora nos níveis de colesterol...', lastUpdated: '2025-07-05T11:30:00Z' },
            { id: 88123, pacienteNome: 'Mariana Costa', queixaPrincipal: 'Check-up anual.', hda: 'Paciente assintomática, busca consulta para check-up de rotina.', lastUpdated: '2025-06-28T09:00:00Z' },
        ];

        // --- LÓGICA PRINCIPAL ---
        const init = () => {
            setupEventListeners();
            loadPacientes();
            renderPacientes();
            applyTheme();
        };

        const loadPacientes = () => {
            const data = localStorage.getItem(STORAGE_KEY_PACIENTES);
            if (data && JSON.parse(data).length > 0) {
                pacientes = JSON.parse(data);
            } else {
                pacientes = DEFAULT_PACIENTES;
                savePacientes();
            }
        };

        const savePacientes = () => {
            localStorage.setItem(STORAGE_KEY_PACIENTES, JSON.stringify(pacientes));
        };
        
        // --- FUNÇÕES DE RENDERIZAÇÃO ---
        const renderPacientes = (filter = '') => {
            listaPacientesEl.innerHTML = '';
            const lowerCaseFilter = filter.toLowerCase();
            
            const filteredPacientes = pacientes.filter(p => 
                p.pacienteNome.toLowerCase().includes(lowerCaseFilter) ||
                p.id.toString().includes(lowerCaseFilter)
            );

            if (filteredPacientes.length === 0) {
                listaPacientesEl.innerHTML = `<p style="text-align: center; color: var(--text-secondary); padding: 20px 0;">Nenhum paciente encontrado.</p>`;
                return;
            }

            filteredPacientes.forEach(paciente => {
                const originalIndex = pacientes.findIndex(p => p.id === paciente.id);
                const li = document.createElement('li');
                li.className = 'item-paciente';
                li.dataset.index = originalIndex;

                const lastUpdatedDate = new Date(paciente.lastUpdated);
                const formattedDate = `Última atualização: ${lastUpdatedDate.toLocaleDateString('pt-BR')} às ${lastUpdatedDate.toLocaleTimeString('pt-br', {hour: '2-digit', minute:'2-digit'})}`;

                li.innerHTML = `
                    <img class="paciente-avatar" src="https://i.pravatar.cc/150?u=${paciente.id}" alt="Avatar do Paciente">
                    <div class="paciente-info">
                        <div class="paciente-nome">${paciente.pacienteNome}</div>
                        <div class="paciente-detalhe">ID: ${paciente.id} | ${formattedDate}</div>
                    </div>
                    <div class="paciente-actions">
                        <button class="delete-btn" data-index="${originalIndex}" title="Remover paciente">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        </button>
                    </div>
                `;
                listaPacientesEl.appendChild(li);
            });
        };

        const showToast = (message, type = 'success') => {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        };

        // --- FUNÇÕES DE MODAL ---
        const openModal = (paciente = null, index = null) => {
            currentEditingIndex = index;
            anamneseForm.reset();
            const modalTitle = document.getElementById('modal-title');
            const modalPacienteId = document.getElementById('modal-paciente-id');

            if (paciente) { // Modo Edição
                modalTitle.textContent = `Editando Anamnese`;
                modalPacienteId.textContent = `Paciente: ${paciente.pacienteNome}`;
                document.getElementById('modal-paciente-nome-input').value = paciente.pacienteNome;
                document.getElementById('modal-paciente-id-input').value = paciente.id;
                document.getElementById('modal-queixa').value = paciente.queixaPrincipal || '';
                document.getElementById('modal-hda').value = paciente.hda || '';
            } else { // Modo Adição
                modalTitle.textContent = 'Nova Anamnese';
                modalPacienteId.textContent = 'Preencha os dados do novo paciente';
            }

            anamneseModal.style.display = 'flex';
            body.classList.add('modal-active');
        };

        const closeModal = () => {
            anamneseModal.style.display = 'none';
            body.classList.remove('modal-active');
            currentEditingIndex = null;
        };

        const applyTheme = () => {
            const isDarkMode = localStorage.getItem(STORAGE_KEY_DARK_MODE) === 'true';
            body.classList.toggle('dark-mode', isDarkMode);
        };

        // --- EVENT LISTENERS ---
        const setupEventListeners = () => {
            darkModeToggle.addEventListener('click', () => {
                const isDarkMode = !body.classList.contains('dark-mode');
                localStorage.setItem(STORAGE_KEY_DARK_MODE, isDarkMode);
                applyTheme();
            });

            addAnamneseBtn.addEventListener('click', () => openModal());
            closeAnamneseModalBtn.addEventListener('click', closeModal);
            anamneseModal.addEventListener('click', (e) => { if (e.target === anamneseModal) closeModal(); });
            
            searchInput.addEventListener('input', (e) => renderPacientes(e.target.value));

            listaPacientesEl.addEventListener('click', (e) => {
                const item = e.target.closest('.item-paciente');
                const deleteBtn = e.target.closest('.delete-btn');

                if (deleteBtn) {
                    e.stopPropagation();
                    deleteIndex = parseInt(deleteBtn.dataset.index, 10);
                    confirmDeleteModal.style.display = 'flex';
                } else if (item) {
                    const index = parseInt(item.dataset.index, 10);
                    openModal(pacientes[index], index);
                }
            });

            anamneseForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const formData = new FormData(anamneseForm);
                const pacienteData = {
                    pacienteNome: formData.get('pacienteNome'),
                    id: parseInt(formData.get('pacienteId'), 10),
                    queixaPrincipal: formData.get('queixaPrincipal'),
                    hda: formData.get('hda'),
                    lastUpdated: new Date().toISOString()
                };

                if (currentEditingIndex !== null) {
                    pacientes[currentEditingIndex] = { ...pacientes[currentEditingIndex], ...pacienteData };
                } else {
                    pacientes.push(pacienteData);
                }
                
                savePacientes();
                renderPacientes(searchInput.value);
                closeModal();
                showToast('Anamnese salva com sucesso!');
            });

            confirmDeleteBtn.addEventListener('click', () => {
                if (deleteIndex !== null) {
                    pacientes.splice(deleteIndex, 1);
                    savePacientes();
                    renderPacientes(searchInput.value);
                    showToast('Paciente removido.', 'error');
                }
                confirmDeleteModal.style.display = 'none';
                deleteIndex = null;
            });

            cancelDeleteBtn.addEventListener('click', () => {
                confirmDeleteModal.style.display = 'none';
                deleteIndex = null;
            });
        };

        // --- INICIALIZAÇÃO ---
        init();
    });
    </script>
</body>
</html>
